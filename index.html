<!DOCTYPE html>
<html lang="en-GB">
  <head>

    <meta property="og:site_name" content="Premium Catering Supplies" />

    <meta name="twitter:title" content="PCS UK — Premium Catering Supplies" />

        "alternateName": "PCS UK",
        "url": "https://pcsuk.co.uk",
        "logo": "https://pcsuk.co.uk/brand/pcsuk-logo.png",

        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Unit 2, North Street",

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PCS UK",
        "url": "https://pcsuk.co.uk/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://pcsuk.co.uk/catalogue?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
